<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句子與語法 - 基礎趣味訓練</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #f0fdfa; /* 溫暖的淺草綠色 */
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-grid-pattern {
            background-image: linear-gradient(to right, #ccfbf1 1px, transparent 1px), linear-gradient(to bottom, #ccfbf1 1px, transparent 1px);
            background-size: 40px 40px;
        }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .pop { animation: pop 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
        .shake { animation: shake 0.4s ease-in-out; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .option-btn { transition: all 0.2s; box-shadow: 0 4px 0 #94a3b8; }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .option-btn.correct { background-color: #d1fae5; border-color: #0d9488; color: #115e59; box-shadow: 0 0 0 transparent; transform: translateY(4px); pointer-events: none; }
        .option-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; opacity: 0.6; pointer-events: none; }

        /* 重組句子專用按鈕 */
        .chunk-btn { transition: all 0.2s; box-shadow: 0 4px 0 #0f766e; }
        .chunk-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .chunk-slot { transition: all 0.2s; border: 2px dashed #99f6e4; background-color: #f0fdfa; }
        
        .tts-btn { transition: transform 0.2s; }
        .tts-btn:active { transform: scale(0.9); }

        .lvl-btn { transition: transform 0.2s; }
        .lvl-btn:hover { transform: scale(1.05); }

        .toast-msg {
            visibility: hidden; min-width: 250px; background-color: #ef4444; color: #fff; text-align: center;
            border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px;
            transform: translateX(-50%); font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .toast-msg.show { visibility: visible; animation: slideUp 0.5s, fadeOut 0.5s 2.5s; }
        @keyframes fadeOut { from {opacity: 1;} to {opacity: 0;} }
    </style>
    <script src="diagnostics.js"></script>
    <script src="student-feedback.js"></script>
    <link rel="stylesheet" href="mobile-accessibility.css">
</head>
<body class="text-slate-800 flex flex-col h-[100dvh] overflow-hidden">

    <!-- 頂部導覽列 (Teal 配色) -->
    <div class="w-full bg-white shadow-md flex flex-col z-20 flex-shrink-0">
        <div class="p-3 lg:p-4 bg-teal-600 text-white flex justify-between items-center w-full">
            <h1 class="text-base lg:text-2xl font-bold tracking-wider flex items-center gap-2">
                <a href="index.html" class="hover:bg-teal-700 p-1 rounded transition bg-teal-800">⬅️ 返回</a>
                <span>📝 句子與語法 (基礎版)</span>
            </h1>
            <div class="flex gap-2 lg:gap-4 items-center bg-teal-800 px-3 py-1.5 rounded-full border border-teal-500 shadow-inner">
                <span class="text-lg lg:text-xl">🏆</span>
                <span class="font-bold text-sm lg:text-lg">EXP: <span id="exp-display" class="text-yellow-400">0</span></span>
            </div>
        </div>
        
        <div id="progress-container" class="w-full bg-slate-200 h-2">
            <div id="progress-bar" class="bg-yellow-400 h-full w-0 transition-all duration-500"></div>
        </div>
    </div>

    <!-- 主畫面區 -->
    <div class="flex-1 overflow-y-auto p-3 md:p-6 relative pb-20 scroll-smooth bg-grid-pattern" id="main-scroll-area">
        
        <div id="quest-mode" class="w-full max-w-5xl mx-auto flex flex-col gap-4 lg:gap-6">
            <!-- 目錄 -->
            <div id="quest-directory" class="w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-200">
                <h2 class="text-2xl font-black text-slate-800 mb-2 flex items-center gap-2">🎯 基礎句型闖關地圖</h2>
                
                <div class="bg-teal-50 border border-teal-200 rounded-xl p-4 mb-6 flex flex-col md:flex-row gap-4 text-sm md:text-base font-bold text-slate-700">
                    <div class="text-teal-800 md:w-32 flex-shrink-0 flex items-center">💡 標記說明：</div>
                    <div class="flex flex-wrap gap-4 flex-1">
                        <div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-yellow-100 border-2 border-yellow-400 flex items-center justify-center text-lg shadow-sm">🌟</span> 一次答對 (+15)</div>
                        <div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-emerald-100 border-2 border-emerald-400 flex items-center justify-center text-lg shadow-sm">✅</span> 嘗試後答對 (+5)</div>
                        <div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg bg-rose-100 border-2 border-rose-400 flex items-center justify-center text-lg shadow-sm">❌</span> 未完成</div>
                    </div>
                </div>

                <div class="sticky top-2 z-10 mb-5 bg-white/95 backdrop-blur border-2 border-teal-200 rounded-2xl p-3 shadow-lg flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <p id="sentence-quick-next-label" role="status" class="text-sm md:text-base font-black text-slate-700">正在整理你的句子練習…</p>
                    <button id="sentence-continue-btn" type="button" onclick="window.continueSentenceLearning()" class="w-full sm:w-auto bg-teal-600 hover:bg-teal-700 text-white font-black px-5 py-3 rounded-xl shadow border-b-4 border-teal-800 active:border-b-0 active:translate-y-1 transition">▶️ 繼續未完成題目</button>
                </div>
                <div id="directory-content" class="flex flex-col gap-4">
                    <!-- 目錄動態生成 -->
                </div>
            </div>
            
            <!-- 答題區 -->
            <div id="quest-play" class="w-full hidden flex-col items-center">
                <!-- 題目動態生成 -->
            </div>
        </div>
    </div>

    <!-- 學習小教學 Modal -->
    <div id="tutorial-modal" class="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-2xl w-[95%] max-w-2xl transform scale-90 transition-transform flex flex-col max-h-[90vh]" id="tutorial-content">
            <div class="flex justify-between items-center mb-4 border-b-2 border-teal-100 pb-3">
                <h2 id="tutorial-title" class="text-2xl md:text-3xl font-black text-teal-600 flex items-center gap-2">📘 學習錦囊</h2>
                <button onclick="window.closeTutorial()" class="text-slate-400 hover:text-rose-500 text-4xl font-bold transition leading-none">&times;</button>
            </div>
            <div id="tutorial-body" class="flex-1 overflow-y-auto pr-2 text-slate-700 text-lg md:text-xl leading-relaxed space-y-4">
                <!-- 教學內容動態載入 -->
            </div>
            <div class="mt-6 pt-4 border-t-2 border-slate-100">
                <button onclick="window.closeTutorial()" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-black py-4 rounded-xl shadow-lg transition text-xl border-b-4 border-teal-700 active:border-b-0 active:translate-y-1">我明白了！開始挑戰 🚀</button>
            </div>
        </div>
    </div>

    <!-- 反饋 Modal -->
    <div id="feedback-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl p-8 shadow-2xl w-[90%] max-w-sm text-center transform scale-90 transition-transform" id="feedback-content">
            <div id="feedback-icon" class="text-7xl mb-4">🎉</div>
            <h2 id="feedback-title" class="text-3xl font-black text-slate-800 mb-2">答對了！</h2>
            <div id="feedback-desc" class="text-slate-600 font-bold mb-6 text-lg leading-relaxed text-center"></div>
            <div class="flex gap-3 w-full mt-4">
                <button onclick="window.backToDirectoryFromModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl shadow transition text-lg">⬅️ 目錄</button>
                <button id="next-btn" class="flex-[1.5] bg-teal-600 hover:bg-teal-700 text-white font-black py-3 rounded-xl shadow-lg transition text-lg border-b-4 border-teal-800 active:border-b-0 active:translate-y-1">下一題 ➡️</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-msg">提示訊息</div>

    <script>
        // ================= 1. 核心狀態與輔助函數 =================
        let sentExp = parseInt(localStorage.getItem('sentBasicExp')) || 0;
        document.getElementById('exp-display').innerText = sentExp;
        let currentQuestionMistakes = 0; 
        let pendingQuestionIdx = -1;
        
        // 用於重組句子的狀態變數
        let reorderSource = []; 
        let reorderTarget = []; 
        let reorderCorrect = []; 

        window.currentHints = [];

        window.cleanTextForSpeech = function(text) {
            if(!text) return "";
            return text.replace(/___/g, '什麼')
                       .replace(/<br\s*\/?>/gi, '。')
                       .replace(/<[^>]*>?/gm, '')
                       .replace(/[✅❌💡【】_]/g, '')
                       .replace(/&nbsp;/g, ' ')
                       .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF]/g, '');
        };

        window.speakText = function(text, rate = 0.9) {
            const preparedText = typeof window.cleanTextForSpeech === 'function'
                ? window.cleanTextForSpeech(text)
                : (typeof cleanTextForSpeech === 'function' ? cleanTextForSpeech(text) : text);
            if (!window.LearningVoice) {
                if (typeof showToast === 'function') showToast('朗讀功能正在準備，請稍後再試。');
                return false;
            }
            return window.LearningVoice.toggle(preparedText, { rate, label: '內容' });
        };

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast-msg show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        };

        // ================= 1.5 學習錦囊內容 (教學資源庫) =================
        const tutorialContents = {
            's-reorder-2': `
                <div class="text-center mb-4"><span class="text-6xl">🧑‍🤝‍🧑 + 🏃</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">什麼是「二素句」？</p>
                <p class="mb-4 text-slate-600">這是最基礎的句子，就像積木一樣，由<span class="text-teal-600 font-bold">兩塊最重要</span>的積木組成：</p>
                <div class="bg-teal-50 p-4 rounded-xl border-2 border-teal-200 mb-3">
                    <p class="text-center font-bold text-lg"><span class="bg-white px-3 py-1 rounded shadow-sm border border-slate-200">1. 是誰？(人物)</span> ➕ <span class="bg-white px-3 py-1 rounded shadow-sm border border-slate-200">2. 做什麼？(動作)</span></p>
                    <hr class="my-3 border-teal-200">
                    <p class="text-center text-xl font-black text-teal-800">弟弟 👦 <span class="text-slate-400 font-normal mx-2">+</span> 在睡覺 😴。</p>
                </div>
            `,
            's-reorder-2adv': `
                <div class="text-center mb-4"><span class="text-6xl">✨ + 🐈 + 💤</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">讓句子變漂亮：「加入形容詞」</p>
                <p class="mb-4 text-slate-600">我們可以在人物前面加上<span class="text-emerald-600 font-bold">「的」</span>字魔法，讓大家知道他長什麼樣子！</p>
                <div class="bg-emerald-50 p-4 rounded-xl border-2 border-emerald-200 mb-3">
                    <p class="text-center font-bold text-lg"><span class="bg-white px-3 py-1 rounded shadow-sm border border-emerald-300 text-emerald-700">形容詞</span> ➕ 人物 ➕ 動作</p>
                    <hr class="my-3 border-emerald-200">
                    <p class="text-center text-xl font-black text-emerald-800"><span class="bg-white px-2 rounded">可愛的</span> 小貓 🐈 在睡覺 😴。</p>
                </div>
            `,
            's-reorder-3': `
                <div class="text-center mb-4"><span class="text-6xl">👦 + 🏫 + 📖</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">什麼是「三素句」？</p>
                <p class="mb-4 text-slate-600">除了知道是誰在做什麼，我們還想知道他<span class="text-blue-600 font-bold">「在哪裡」</span>或<span class="text-blue-600 font-bold">「什麼時候」</span>做這件事！</p>
                <div class="bg-blue-50 p-4 rounded-xl border-2 border-blue-200 mb-3">
                    <p class="text-center font-bold text-lg flex flex-col gap-2">
                        <span class="bg-white px-3 py-1 rounded shadow-sm border border-slate-200">1. 人物</span> 
                        <span class="text-xl">➕</span>
                        <span class="bg-blue-100 px-3 py-1 rounded shadow-sm border border-blue-300 text-blue-800">2. 在哪裡？(地點)</span>
                        <span class="text-xl">➕</span>
                        <span class="bg-white px-3 py-1 rounded shadow-sm border border-slate-200">3. 做什麼？(動作)</span>
                    </p>
                    <hr class="my-3 border-blue-200">
                    <p class="text-center text-xl font-black text-blue-800">哥哥 👦 <span class="bg-white px-2 rounded">在房間</span> 🏠 看書 📖。</p>
                </div>
            `,
            's-reorder-4': `
                <div class="text-center mb-4"><span class="text-6xl">⏰ + 👨‍👩‍👧 + ⛲ + 🧺</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">終極挑戰：「四素句」</p>
                <p class="mb-4 text-slate-600">這是最完整的句子！我們要把<span class="text-indigo-600 font-bold">時間</span>放在最前面或人物後面。</p>
                <div class="bg-indigo-50 p-4 rounded-xl border-2 border-indigo-200 mb-3">
                    <p class="text-center font-bold text-base flex flex-col gap-1">
                        <span class="bg-indigo-100 px-2 py-1 rounded border border-indigo-300 text-indigo-800">1. 時間 (什麼時候)</span> 
                        <span class="text-sm">➕</span>
                        <span class="bg-white px-2 py-1 rounded border border-slate-200">2. 人物 (是誰)</span>
                        <span class="text-sm">➕</span>
                        <span class="bg-blue-100 px-2 py-1 rounded border border-blue-300 text-blue-800">3. 地點 (在哪裡)</span>
                        <span class="text-sm">➕</span>
                        <span class="bg-white px-2 py-1 rounded border border-slate-200">4. 動作 (做什麼)</span>
                    </p>
                    <hr class="my-3 border-indigo-200">
                    <p class="text-center text-lg font-black text-indigo-800"><span class="bg-white px-2 rounded">星期天，</span>我們 👨‍👩‍👧 <span class="bg-white px-2 rounded">去公園</span> ⛲ 野餐 🧺。</p>
                </div>
            `,
            's-fill': `
                <div class="text-center mb-4"><span class="text-6xl">🕵️‍♂️ 🔍</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">如何選對詞語？</p>
                <p class="mb-4 text-slate-600">做填充題時，要像小偵探一樣，找句子裡面的<span class="text-amber-600 font-bold">「提示詞」</span>！</p>
                <div class="bg-amber-50 p-4 rounded-xl border-2 border-amber-200 mb-3">
                    <p class="text-slate-600 font-bold">例子：</p>
                    <p class="text-lg">天氣很<span class="bg-amber-200 px-2 rounded font-black text-amber-800">熱</span> 🥵，我想吃 ___。</p>
                    <p class="text-base text-slate-500 mt-2">👉 因為看到「熱」，所以答案一定是冰涼的<span class="font-bold text-amber-600">「雪糕」</span>，不會是「火鍋」！</p>
                </div>
            `,
            's-babei': `
                <div class="text-center mb-4"><span class="text-6xl">🔄 🍎</span></div>
                <p class="font-bold text-slate-700 mb-4 text-center">「把」和「被」的分別？</p>
                <p class="mb-4 text-slate-600">只要記住<span class="text-rose-600 font-bold">誰做動作</span>，就能輕鬆分出來！</p>
                <div class="bg-orange-50 p-4 rounded-xl border-2 border-orange-200 mb-3 space-y-4">
                    <div>
                        <p class="font-black text-orange-800 text-xl border-b border-orange-200 pb-1 mb-2">主動去做的用「把」</p>
                        <p class="text-lg">👦🏻 弟弟 <span class="text-orange-600 font-black bg-white px-2 rounded">把</span> 蘋果 🍎 吃了。</p>
                    </div>
                    <div>
                        <p class="font-black text-rose-800 text-xl border-b border-rose-200 pb-1 mb-2">受到動作影響的用「被」</p>
                        <p class="text-lg">🍎 蘋果 <span class="text-rose-600 font-black bg-white px-2 rounded">被</span> 弟弟 👦🏻 吃了。</p>
                    </div>
                </div>
            `
        };

        window.showTutorial = function(categoryId) {
            const modal = document.getElementById('tutorial-modal');
            const content = document.getElementById('tutorial-content');
            
            document.getElementById('tutorial-body').innerHTML = tutorialContents[categoryId];
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-90'); }, 10);
            
            localStorage.setItem('tut_seen_' + categoryId, 'true');
        };

        window.closeTutorial = function() {
            const modal = document.getElementById('tutorial-modal');
            const content = document.getElementById('tutorial-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (pendingQuestionIdx !== -1) {
                    let targetIdx = pendingQuestionIdx;
                    pendingQuestionIdx = -1;
                    window.startQuestion(targetIdx, true); 
                }
            }, 300);
        };

        // ================= 3. 基礎語法題庫 (120題) =================
        const categories = [
            { id: 's-reorder-2', title: '🧩 簡單重組 (二素句)', color: 'emerald' },
            { id: 's-reorder-2adv', title: '🧩 進階重組 (加形容詞)', color: 'teal' },
            { id: 's-reorder-3', title: '🧩 複雜重組 (三素句)', color: 'cyan' },
            { id: 's-reorder-4', title: '🧩 終極重組 (四素句)', color: 'indigo' },
            { id: 's-fill', title: '📝 圖片配詞填充 (看圖選詞)', color: 'blue' },
            { id: 's-babei', title: '🔄 把/被字句基礎 (選字填空)', color: 'amber' }
        ];

        function mapData(pool, category, task) {
            return pool.map(item => ({ category, task, qData: item }));
        }

        const reorder2Pool = [
            [['我', '在唱歌。'], '🎤'], [['弟弟', '在睡覺。'], '😴'], [['小鳥', '在飛。'], '🐦'], [['魚兒', '在游泳。'], '🐟'], [['老師', '在教書。'], '👨‍🏫'],
            [['妹妹', '在畫畫。'], '🎨'], [['爸爸', '在喝茶。'], '🍵'], [['太陽', '出來了。'], '☀️'], [['下雨', '了。'], '☔'], [['花兒', '開了。'], '🌸'],
            [['哥哥', '在跑步。'], '🏃'], [['貓咪', '伸懶腰。'], '🐈'], [['小狗', '在叫。'], '🐶'], [['風', '吹著。'], '🌬️'], [['寶寶', '在哭。'], '👶'],
            [['青蛙', '在跳。'], '🐸'], [['樹葉', '落下來。'], '🍂'], [['雪', '下著。'], '❄️'], [['汽車', '在行駛。'], '🚗'], [['飛機', '起飛了。'], '✈️']
        ];

        const reorder2AdvPool = [
            [['可愛的', '小貓', '在睡覺。'], '🐈'], [['紅紅的', '蘋果', '掉下來。'], '🍎'], [['美麗的', '蝴蝶', '在飛舞。'], '🦋'], [['明亮的', '星星', '在閃爍。'], '✨'], [['大大的', '氣球', '飛走了。'], '🎈'],

                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <button onclick="window.moveToTarget(${idx})" class="chunk-btn flex-1 bg-white border-2 border-slate-300 text-slate-700 hover:border-teal-400 hover:bg-teal-50 font-black text-xl md:text-2xl py-3 px-5 rounded-xl shadow transition">${chunk}</button>
                        <button onclick="window.speakText('${safeChunk}')" class="tts-btn flex-shrink-0 bg-teal-50 text-teal-600 w-12 h-12 rounded-full text-2xl flex items-center justify-center shadow-sm border border-teal-200 hover:bg-teal-100 transition">🔊</button>
                    </div>`;
                }
            });
            sArea.innerHTML = sHtml;

            if (reorderTarget.length > 0 && reorderTarget.length === reorderCorrect.length) {
                window.checkReorderAnswer();
            }
        };

        window.moveToTarget = function(sourceIdx) {
            let chunk = reorderSource[sourceIdx];
            reorderSource[sourceIdx] = null; 
            reorderTarget.push(chunk);
            window.speakText(chunk);
            window.renderReorderUI();
        };

        window.removeFromTarget = function(targetIdx) {
            let chunk = reorderTarget[targetIdx];
            reorderTarget.splice(targetIdx, 1);
            let emptyIdx = reorderSource.indexOf(null);
            if(emptyIdx !== -1) reorderSource[emptyIdx] = chunk;
            window.renderReorderUI();
        };

        window.checkReorderAnswer = function() {
            let isCorrect = true;
            let correctCount = 0;
            for(let i=0; i<reorderTarget.length; i++) {
                if(reorderTarget[i] === reorderCorrect[i]) {
                    correctCount++;
                } else {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect && reorderTarget.length === reorderCorrect.length) {
                window.speakText("重組正確！" + reorderCorrect.join(''));
                window.handleCorrectAnswer(reorderCorrect.join(''));
            } else if (reorderTarget.length === reorderCorrect.length) {
                window.speakText("順序好像有點不對喔，請看提示！");
                currentQuestionMistakes++;
                userProgress[currentQuestionIdx] = -1;
                localStorage.setItem('sentBasicProgress', JSON.stringify(userProgress));
                
                let chunksToReturn = reorderTarget.splice(correctCount);
                for (let chunk of chunksToReturn) {
                    let emptyIdx = reorderSource.indexOf(null);
                    if(emptyIdx !== -1) {
                        reorderSource[emptyIdx] = chunk;
                    } else {
                        reorderSource.push(chunk);
                    }
                }

                let hintWord = reorderCorrect[correctCount];
                let newHint = `排錯了喔！正確的部分已保留。<br>👉 下一個詞語應該是：「<span class="text-rose-600">${hintWord}</span>」`;
                
                document.getElementById('hint-text').innerHTML = "💡 提示：" + newHint;
                document.getElementById('hint-tts-btn').onclick = () => window.speakText(`排錯了喔。下一個詞語應該是，${hintWord}`);
                document.getElementById('dynamic-hint-box').classList.remove('hidden');
                document.getElementById('dynamic-hint-box').classList.add('slide-up');

                const tArea = document.getElementById('reorder-target-area');
                tArea.classList.add('bg-rose-100', 'border-rose-400', 'shake');
                setTimeout(() => tArea.classList.remove('bg-rose-100', 'border-rose-400', 'shake'), 800);
                
                window.renderReorderUI();
            }
        };

        window.checkSelectionAnswer = function(btnElement, isCorrect, clickedText) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (isCorrect) {
                btnElement.classList.add('correct');
                const fullSentence = rawQuestDataObj[currentQuestionIdx].qData[0].replace('___', btnElement.innerText);
                window.speakText("答對了！" + fullSentence);
                window.handleCorrectAnswer(fullSentence);
            } else {
                btnElement.classList.add('wrong', 'shake');
                currentQuestionMistakes++; 
                userProgress[currentQuestionIdx] = -1;
                localStorage.setItem('sentBasicProgress', JSON.stringify(userProgress));
                
                let hintMsg = "請再仔細想一想！";
                const qType = rawQuestDataObj[currentQuestionIdx].category;
                if (qType === 's-babei') {
                    hintMsg = "注意句子裡的動作喔！主動去做用「把」，受到動作影響用「被」。";
                } else if (qType === 's-fill') {
                    hintMsg = "看看句子裡的提示詞和表情符號，這個答案好像不太通順喔！";
                }

                document.getElementById('hint-text').innerHTML = "💡 提示：" + hintMsg;
                document.getElementById('hint-tts-btn').onclick = () => window.speakText(hintMsg);
                document.getElementById('dynamic-hint-box').classList.remove('hidden');
                document.getElementById('dynamic-hint-box').classList.add('slide-up');

                window.speakText("不對喔，" + hintMsg);
                
                setTimeout(() => {
                    btnElement.classList.remove('wrong', 'shake');
                    allBtns.forEach(b => { if (!b.classList.contains('correct')) b.style.pointerEvents = 'auto'; });
                }, 1500);
            }
        };

        window.handleCorrectAnswer = function(completeSentence) {
            let finalStatus = currentQuestionMistakes === 0 ? 1 : 2;
            let previousStatus = userProgress[currentQuestionIdx];
            let expGained = 0;

            if (previousStatus !== 1 && previousStatus !== 2) {
                expGained = finalStatus === 1 ? 15 : 5;
            } else if (previousStatus === 2 && finalStatus === 1) {
                expGained = 10; 
            }

            if (expGained > 0) {
                sentExp += expGained;
                localStorage.setItem('sentBasicExp', sentExp);
                document.getElementById('exp-display').innerText = sentExp;
                document.getElementById('exp-display').classList.add('pop');
                setTimeout(() => document.getElementById('exp-display').classList.remove('pop'), 400);
            }

            if (finalStatus === 1 || previousStatus !== 1) {
                userProgress[currentQuestionIdx] = finalStatus;
                localStorage.setItem('sentBasicProgress', JSON.stringify(userProgress));
            }

            let modalIcon = finalStatus === 1 ? '🌟' : '✅';
            let modalTitle = finalStatus === 1 ? '太棒了！一次答對！' : '成功過關！';
            let expMsg = expGained > 0 
                ? `<span class="text-teal-600 block text-xl mb-4">獲得 ${expGained} 點經驗值 ✨</span>` 
                : `<span class="text-slate-500 block text-lg mb-4">這題已經成功過關囉！</span>`;
            
            let combinedDesc = expMsg + `
                <div class="bg-slate-100 border-l-4 border-teal-500 p-4 text-left text-slate-800 rounded-r-lg font-bold text-xl flex items-center justify-between">
                    <span>${completeSentence}</span>
                    <button onclick="window.speakText('${completeSentence.replace(/'/g, "\\'")}')" class="bg-white rounded-full w-10 h-10 flex items-center justify-center shadow-sm hover:bg-teal-100 text-xl transition active:scale-95">🔊</button>
                </div>`;

            setTimeout(() => { window.showModal(modalIcon, modalTitle, combinedDesc); }, 1000);
        };

        window.showModal = function(icon, title, desc) {
            const modal = document.getElementById('feedback-modal');
            const content = document.getElementById('feedback-content');
            document.getElementById('feedback-icon').innerText = icon;
            document.getElementById('feedback-title').innerText = title;
            document.getElementById('feedback-desc').innerHTML = desc;
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-90'); }, 10);
        };

        window.backToDirectory = function() {
            let hintBox = document.getElementById('dynamic-hint-box');
            if(hintBox) hintBox.classList.add('hidden');
            document.getElementById('quest-play').style.display = 'none';
            document.getElementById('quest-directory').style.display = 'block';
            window.renderDirectory();
        };

        window.backToDirectoryFromModal = function() {
            const modal = document.getElementById('feedback-modal');
            const content = document.getElementById('feedback-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                window.backToDirectory();
            }, 300);
        };

        window.goToNextQuestion = function() {
            const modal = document.getElementById('feedback-modal');
            const content = document.getElementById('feedback-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                let nextIdx = currentQuestionIdx + 1;
                if (nextIdx < rawQuestDataObj.length) window.startQuestion(nextIdx);
                else { window.showToast("恭喜完成所有挑戰！"); window.backToDirectory(); }
            }, 300);
        };

        window.onload = function() {
            document.getElementById('exp-display').innerText = sentExp;
            window.renderDirectory();
            document.getElementById('next-btn').onclick = window.goToNextQuestion;
        };
    </script>
    <script src="voice-manager.js"></script>
    <script type="module" src="firebase-progress-bridge.js"></script>
</body>
</html>
